[project]
name = "skillissue-backend"
version = "0.1.0"
description = "Skill Issue Backend API — AI-powered interview preparation platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.28",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.13.1",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.1",
    "cryptography>=42.0.0",
    "boto3>=1.34.0",
    "botocore>=1.34.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "docker>=7.0.0",
    "pypdf>=4.0.0",
    "langchain-core>=1.6.0",
    "langgraph>=1.2.0",
    "langgraph-checkpoint>=4.3.0",
    "langgraph-checkpoint-postgres>=3.2.0",
    "langchain-aws>=1.9.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0"
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --asyncio-mode=auto"
testpaths = ["tests"]
pythonpath = ["."]
